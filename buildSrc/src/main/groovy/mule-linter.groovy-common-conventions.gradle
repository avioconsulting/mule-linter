plugins {
    id 'groovy'
//    id 'codenarc'
    id 'mule-linter.semver'
}

group = 'com.avioconsulting.mule'

repositories {
    mavenCentral()
}

dependencies {
//    implementation 'org.apache.groovy:groovy-all:4.0.31@pom'
    implementation('org.apache.groovy:groovy-all:4.0.31@pom') {
        transitive = true
    }
    testImplementation platform('org.spockframework:spock-bom:2.4-groovy-4.0')
    testImplementation 'org.spockframework:spock-core:2.4-groovy-4.0'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(8)
    }
    withSourcesJar()
}

// Groovy compilation optimizations - applied via tasks.withType below

test {
    useJUnitPlatform()
    
    // Performance optimizations
    maxParallelForks = Runtime.runtime.availableProcessors().intdiv(2) ?: 1
    forkEvery = 100  // Restart forked JVM after 100 test classes to avoid memory leaks
    
    // Disable expensive effective-pom generation during tests
    // Tests use sample projects with MuleSoft dependencies that require network access
    // and cause Maven invoker to hang trying to resolve remote artifacts
    systemProperty 'mule.linter.skipEffectivePom', 'true'
    
    // Test output settings
    testLogging {
        events = ['passed', 'skipped', 'failed']
        showExceptions = true
        showCauses = true
        showStackTraces = true
        exceptionFormat = 'FULL'
    }
    
    // Reports
    reports {
        html.required = true
        junitXml.required = true
    }
    // Note: reports.html.required syntax is OK - 'required' is a Property<Boolean>, not a direct boolean
    
    // Timeout for individual tests (prevent hanging tests)
    timeout = Duration.ofMinutes(5)
    
    // Optimize test startup - only scan for tests once
    scanForTestClasses = true
    
    // Disable redundant outputs for faster test execution
    outputs.upToDateWhen { true }
}

// Enable forked compilation for better memory management
tasks.withType(GroovyCompile) {
    options.fork = true
    options.forkOptions.jvmArgs = ['-Xmx512m', '-XX:+UseParallelGC']
}

// Cache all compilation tasks
tasks.withType(JavaCompile) {
    options.fork = true
    options.forkOptions.memoryMaximumSize = '512m'
}

compileJava {
    options.encoding = 'UTF-8'
    options.compilerArgs << "-Xlint:unchecked"
}

compileTestJava {
    options.encoding = 'UTF-8'
    options.compilerArgs << "-Xlint:unchecked"
}

// GroovyDoc jar task - only runs when explicitly requested or during publishing
tasks.register('groovydocJar', Jar) {
    dependsOn groovydoc
    archiveClassifier = 'javadoc'
    from groovydoc.destinationDir
    // Only build when explicitly requested or during publish
    onlyIf { 
        gradle.taskGraph.hasTask(":${project.name}:publish") ||
        gradle.taskGraph.hasTask(":${project.name}:publishToMavenLocal") ||
        project.hasProperty('generateDocs')
    }
}
// Note: 'from' and 'dependsOn' above are method calls, not property assignments - this syntax is correct

// Only include groovydocJar in jar task for publishing builds
gradle.taskGraph.whenReady { graph ->
    if (graph.hasTask(":${project.name}:publish") ||
        graph.hasTask(":${project.name}:publishToMavenLocal") ||
        project.hasProperty('generateDocs')) {
        jar.dependsOn(groovydocJar)
    }
}

