plugins {
    id 'groovy-gradle-plugin'
}

repositories {
    gradlePluginPortal()
}

dependencies {
    implementation 'org.gradlex.maven-plugin-development:org.gradlex.maven-plugin-development.gradle.plugin:1.0.3'
    implementation 'net.thauvin.erik.gradle.semver:net.thauvin.erik.gradle.semver.gradle.plugin:1.0.4'
    implementation 'com.gradleup.shadow:shadow-gradle-plugin:8.3.9'
    testImplementation platform("org.spockframework:spock-bom:2.2-groovy-3.0")
    testImplementation 'org.spockframework:spock-core'
}
