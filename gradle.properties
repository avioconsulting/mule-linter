# Gradle performance optimizations
# See https://docs.gradle.org/current/userguide/build_environment.html

# Enable parallel build execution
org.gradle.parallel=true

# Enable the build cache
org.gradle.caching=true

# Enable the configuration cache (Gradle 6.6+)
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn
org.gradle.configuration-cache.max-problems=10

# Increase memory allocation with GC optimizations
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -XX:+UseParallelGC -XX:MaxGCPauseMillis=200 -XX:GCTimeRatio=4

# Enable file system watching (Gradle 6.7+)
org.gradle.vfs.watch=true

# Increase the number of workers
org.gradle.workers.max=4

# Dependency resolution optimizations
org.gradle.dependency.verification=lenient
systemProp.https.protocols=TLSv1.2,TLSv1.3

# Groovy compilation optimizations
systemProp.groovy.target.indy=true
systemProp.groovy.parallel.numThreads=4
