name: Temporary snapshot publishing test

on:
  push:
    branches: [feat/central-snapshot-publishing]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Stage isolated test snapshot
        run: ./gradlew clean publish -Dversion.semver=2.0.1-SNAPSHOT
      - name: Publish snapshot with JReleaser
        uses: jreleaser/release-action@2.5.0
        env:
          JRELEASER_VERSION: '1.26.0'
          JRELEASER_PROJECT_VERSION: 2.0.1-SNAPSHOT
          JRELEASER_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JRELEASER_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
          JRELEASER_GPG_PUBLIC_KEY: ${{ secrets.MAVEN_GPG_PUBLIC_KEY }}
          JRELEASER_GPG_SECRET_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          JRELEASER_MAVENCENTRAL_USERNAME: ${{ secrets.MAVEN_PUBLISH_USERNAME }}
          JRELEASER_MAVENCENTRAL_PASSWORD: ${{ secrets.MAVEN_PUBLISH_PASSWORD }}
          JRELEASER_NEXUS2_USERNAME: ${{ secrets.MAVEN_PUBLISH_USERNAME }}
          JRELEASER_NEXUS2_PASSWORD: ${{ secrets.MAVEN_PUBLISH_PASSWORD }}
        with:
          version: ${{ env.JRELEASER_VERSION }}
          arguments: deploy --deployer nexus2
      - name: Resolve published plugin from a clean Maven repository
        run: |
          mvn --batch-mode org.apache.maven.plugins:maven-dependency-plugin:3.11.0:get \
            -Dmaven.repo.local="$RUNNER_TEMP/snapshot-consumer" \
            -Dartifact=com.avioconsulting.mule:mule-linter-maven-plugin:2.0.1-SNAPSHOT \
            -DremoteRepositories=central-snapshots::default::https://central.sonatype.com/repository/maven-snapshots/
      - name: Upload publishing diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: snapshot-publishing-diagnostics
          path: out/jreleaser/trace.log
