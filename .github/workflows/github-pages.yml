# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches:
      - main

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Single deploy job since we're just deploying
  deploy-pages:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: 'recursive'
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set Maven Home
        id: set-maven-home
        run: echo "maven-home=$(mvn -v | grep "Maven home" | sed -e "s/^Maven home\:\ //")" >> $GITHUB_OUTPUT

      - name: Print Maven Home
        run: echo "Maven Home ${{steps.set-maven-home.outputs.maven-home}}"

      - name: Verify and generate Groovydoc
        run: ./gradlew check :mule-linter-core:groovydoc
        env:
          MAVEN_HOME: ${{steps.set-maven-home.outputs.maven-home}}
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Verify Pages content
        run: test -s mule-linter-core/build/docs/groovydoc/index.html
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          # Upload the generated API documentation only
          path: './mule-linter-core/build/docs/groovydoc'
      - name: Deploy to GitHub Pages
        if: ${{ !env.ACT }}
        id: deployment
        uses: actions/deploy-pages@v5
